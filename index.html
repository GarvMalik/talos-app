<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talos Care - Home</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,600,1,0" />
    <link rel="manifest" href="/talos-app/manifest.json">
<meta name="theme-color" content="#386641">
<meta name="description" content="Secure, accessible AI-powered pre-screening tool for patient intake">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23386641' width='180' height='180'/><text x='90' y='90' font-size='80' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central'>T</text></svg>">
</head>
<body>
    <div class="mobile-container">
        <header class="app-header">
            <div class="spacer"></div>
            <h1>Talos Care</h1>
            <button class="settings-btn" data-navigate="html/settings.html">
                <span class="material-symbols-rounded">settings</span>
            </button>
        </header>

        <main>
            <div class="greeting-section">
                <h2 id="greetingText">Good Morning!</h2>
                <p>How Can Talos Assist You Today?</p>
            </div>

            <button class="btn-primary" data-navigate="html/intake.html">
                <div class="btn-text">
                    <h3>Start Screening</h3>
                    <p>Takes about 3-5 minutes.</p>
                </div>
                <span class="material-symbols-rounded">assignment</span>
            </button>

            <div class="secondary-actions">
                <button class="btn-secondary btn-past" data-navigate="html/past-summaries.html">
                    <span class="material-symbols-rounded">history</span>
                    <h3>Past<br>Summaries</h3>
                </button>

                <button class="btn-secondary btn-emergency" data-navigate="html/emergency.html">
                    <span class="material-symbols-rounded">emergency</span>
                    <h3>Emergency<br>Protocols</h3>
                </button>
            </div>
        </main>
    </div>
    
<script src="js/error-handler.js"></script>
<script src="js/pdf-generator.js"></script>
  <script src="js/global.js"></script>
  
  <script>
  // Register service worker for PWA functionality
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/talos-app/sw.js')
            .then((registration) => {
                console.log('[PWA] Service Worker registered:', registration);
            })
            .catch((err) => {
                console.warn('[PWA] Service Worker registration failed:', err);
            });
    });
}
</script>
</body>
</html>
